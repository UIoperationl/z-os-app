name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        working-directory: android
        run: |
          # Generate gradle wrapper
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/z-os.apk
          ls -lh output/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: z-os-apk
          path: output/z-os.apk

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: Z-OS v1.0.0
          files: output/z-os.apk
          body: |
            # Z-OS Android App

            ## Installation
            1. Download `z-os.apk` below
            2. On your phone: Settings → Security → enable "Install from unknown sources"
            3. Open the APK file (from Files app or browser downloads)
            4. Tap "Install"
            5. Launch "Z-OS" from app drawer

            ## Features
            - Full Z-OS desktop in your pocket
            - Real bash shell (when backend is alive)
            - AI chat with tools: bash, image gen, TTS, web search
            - BYOK: use any OpenAI-compatible API
            - Editable system prompt
            - Auto-rotates: portrait = phone mode, landscape = desktop mode
            - Fullscreen immersive (no status bar)

            ## Changing the URL
            Press your phone's Menu button (or Recent Apps button on some devices). A URL bar appears at top. Enter a new URL and tap "Load".

            ## Note
            The app points to the Z-OS sandbox URL by default. This URL is only alive when the chat session is active. For 24/7 access, deploy the [web app](https://github.com/UIoperationl/z-os-computer-web) to Vercel and update the URL in the app.

            ## Built
            Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
