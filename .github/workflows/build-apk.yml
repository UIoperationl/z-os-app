name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-platform: 34
          sdk-build-tools: 34.0.0

      - name: Install Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip -d /opt/
          echo "/opt/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Generate Gradle Wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.2 --distribution-type bin

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/z-os.apk
          ls -lh output/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: z-os-apk
          path: output/z-os.apk

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.3.0
          name: Z-OS v1.3.0 — Background resilience + error recovery
          files: output/z-os.apk
          body: |
            # Z-OS Android App v1.3.0

            ## What's new
            - WakeLock: app keeps CPU running for 30s after you minimize (lets in-flight requests complete)
            - WebView doesn't pause JS when minimized (fetches continue)
            - Error recovery page with Retry button if connection drops
            - Auto-reload on resume if page is blank
            - Web app: auto-retry failed requests (3 attempts with backoff)
            - Web app: proper JSON error handling (no more "Unexpected token <")

            ## Installation
            1. Download `z-os.apk` below
            2. On your phone: Settings → Security → enable "Install from unknown sources"
            3. Open the APK file
            4. Tap "Install" (updates over v1.2.0)
            5. Launch "Z-OS" from app drawer

            ## Features
            - Full Z-OS desktop in your pocket
            - Real bash shell (when backend is alive)
            - AI chat with FULL tool use: bash, image gen, TTS, web search, tool installation
            - BYOK: use any OpenAI-compatible API
            - Editable system prompt
            - UI customization: themes, colors, font size, timeout
            - Auto-rotates: portrait = phone mode, landscape = desktop mode
            - Fullscreen immersive (no status bar)
            - File downloads
            - Background resilience (minimize app without losing requests)
            - Auto-retry on network errors

            ## Built
            Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
