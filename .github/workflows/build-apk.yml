name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-platform: 34
          sdk-build-tools: 34.0.0

      - name: Install Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip -d /opt/
          echo "/opt/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Generate Gradle Wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.2 --distribution-type bin

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/z-os.apk
          ls -lh output/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: z-os-apk
          path: output/z-os.apk

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.0.0
          name: Z-OS v2.0.0 — Fix server crashes + silent auto-retry
          files: output/z-os.apk
          body: |
            # Z-OS Android App v2.0.0

            ## What's new
            - **CRASH FIXED** — removed foregroundServiceType that crashed on Android 14
            - **Settings window** — BYOK, system prompt, UI customization, timeout all moved to dedicated Settings window (no more chat clutter)
            - **Mobile settings tab** — Settings now accessible on phone (was hidden before)
            - **Runtime permissions** — properly requests POST_NOTIFICATIONS and storage permissions
            - **Simplified BackgroundService** — wrapped in try/catch so it never crashes the app
            - All UI customization now works on mobile too

            ## Installation
            1. Download `z-os.apk` below
            2. Install it (updates over v1.4.0)
            3. Launch Z-OS

            ## What was crashing v1.4.0
            The `foregroundServiceType="dataSync"` attribute in the manifest requires a special permission on Android 14 (FOREGROUND_SERVICE_DATA_SYNC). Without it, the app crashes on launch. Removed the attribute — the foreground service still works, just without the typed declaration.

            ## Features
            - Full Z-OS desktop in your pocket
            - Real bash shell + AI with full tool use
            - BYOK + editable system prompt (in Settings window)
            - UI customization (themes, colors, font) — now works on mobile!
            - Auto-rotate portrait/landscape
            - File downloads (saves to /Download/Z-OS/)
            - Background execution (foreground service)
            - Clean, uncluttered chat interface

            ## Built
            Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
