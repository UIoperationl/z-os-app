name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-platform: 34
          sdk-build-tools: 34.0.0

      - name: Install Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip -d /opt/
          echo "/opt/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Generate Gradle Wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.2 --distribution-type bin

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/z-os.apk
          ls -lh output/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: z-os-apk
          path: output/z-os.apk

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.4.0
          name: Z-OS v1.4.0 — File downloads + foreground service + simpler error handling
          files: output/z-os.apk
          body: |
            # Z-OS Android App v1.4.0

            ## What's new
            - **File downloads work!** Click ⬇ on any file → Android Download Manager saves it to /Download/Z-OS/
            - **Foreground service** keeps app alive in background (no more killed requests when minimized)
            - **WakeLock** prevents CPU sleep while app is running
            - **Simpler error handling** — no more complex retry loops, just a clean retry button
            - **WebView doesn't pause** when minimized — JS keeps running

            ## Installation
            1. Download `z-os.apk` below
            2. Install it (updates over v1.3.0)
            3. Launch Z-OS
            4. You'll see a "Z-OS running in background" notification — that's the foreground service keeping it alive
            5. To download a file: open File Browser → click ⬇ next to any file

            ## Features
            - Full Z-OS desktop in your pocket
            - Real bash shell + AI with full tool use
            - BYOK + editable system prompt
            - UI customization (themes, colors, font, timeout)
            - Auto-rotate portrait/landscape
            - **File downloads** (saves to /Download/Z-OS/)
            - **Background execution** (foreground service)
            - Auto-retry button on errors

            ## Permissions
            - INTERNET, ACCESS_NETWORK_STATE — connect to backend
            - WAKE_LOCK — keep CPU running
            - FOREGROUND_SERVICE — stay alive in background
            - WRITE_EXTERNAL_STORAGE — save downloaded files
            - POST_NOTIFICATIONS — show background notification

            ## Built
            Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
